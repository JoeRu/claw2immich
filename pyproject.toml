[project]
name = "claw2immich"
version = "0.1.0"
description = "MCP Server for [immich-app](https://immich.app/)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=1.26.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-timeout>=2.4.0",
    "pytest-cov>=6.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 30
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
]
